<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Data Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="mb-4">📊 Dashboard & Data Analytics</h2>

        <!-- 1. ส่วนอัปโหลดไฟล์ -->
        <div class="card mb-4">
            <div class="card-header fw-bold">1. อัปโหลดไฟล์ข้อมูล (.csv)</div>
            <div class="card-body">
                <form action="/" method="post" enctype="multipart/form-data" class="row g-3 align-items-center">
                    <div class="col-auto">
                        <input type="file" name="file" accept=".csv" class="form-control" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>

        {% if columns %}
        <!-- 2. ส่วนกรองข้อมูล -->
        <div class="card mb-4">
            <div class="card-header fw-bold">2. กรองข้อมูล (Filter Data)</div>
            <div class="card-body">
                <form action="/" method="post" class="row g-3">
                    <!-- เลือกลำดับคอลัมน์ที่ต้องการกรอง -->
                    <div class="col-md-5">
                        <label class="form-label">เลือกคอลัมน์ (Column):</label>
                        <select name="selected_column" class="form-select" onchange="this.form.submit()">
                            {% for col in columns %}
                                <option value="{{ col }}" {% if col == selected_column %}selected{% endif %}>{{ col }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- เลือกค่าในคอลัมน์นั้น -->
                    <div class="col-md-5">
                        <label class="form-label">เลือกข้อมูล (Value):</label>
                        <select name="selected_value" class="form-select" onchange="this.form.submit()">
                            <option value="ALL">-- แสดงทั้งหมด (All) --</option>
                            {% for val in unique_values %}
                                <option value="{{ val }}" {% if val|string == selected_value|string %}selected{% endif %}>{{ val }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
        </div>
        {% endif %}

        <!-- 3. แสดงตาราง -->
        {% if data_html %}
        <div class="card">
            <div class="card-header fw-bold d-flex justify-content-between align-items-center">
                <span>3. ตารางแสดงข้อมูล</span>
                <form action="/" method="post" class="m-0">
                    <input type="hidden" name="action" value="clear">
                    <button type="submit" class="btn btn-danger btn-sm">🗑️ ล้างข้อมูล (Clear Data)</button>
                </form>
            </div>
            <div class="card-body table-responsive">
                {{ data_html | safe }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
